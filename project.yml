# Generate the Xcode project with: xcodegen generate
name: NarutoUC2
options:
  bundleIdPrefix: com.byescaleira
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Marks the project as up to date with Xcode 27 (no "Update to recommended settings").
  xcodeVersion: "27.0"

packages:
  UCKit:
    path: Packages/UCKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 27 recommended settings (Base_ProjectSettings template).
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    MTL_FAST_MATH: YES

targets:
  NarutoUC2:
    type: application
    supportedDestinations: [iOS, macOS, tvOS]
    sources:
      - path: App/Sources
      # Metal shaders for UCRender, compiled into the app's default.metallib.
      - path: App/Shaders
      # UI strings: English source, Brazilian Portuguese translation.
      - path: App/Resources
      # Icon Composer icon (iOS, iPadOS, macOS); layers built from game textures by re/scripts/MakeIcon.swift.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
        destinationFilters: [iOS, macOS]
      # tvOS layered icon + Top Shelf (brand assets).
      - path: App/tvOS/Assets.xcassets
        destinationFilters: [tvOS]
    dependencies:
      - package: UCKit
        product: UCEngine
      - package: UCKit
        product: UCRender
      - package: UCKit
        product: UCFormats
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Naruto UC2"
        LSApplicationCategoryType: public.app-category.action-games
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Landscape only. iPhone declares it here; iPadOS 26 resizable scenes must declare every
        # orientation, so iPad locks to landscape at runtime (GameViewController) and keeps the
        # scene at screen size (UISceneSizeRestrictions) instead of the deprecated UIRequiresFullScreen.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.byescaleira.nuc2
        PRODUCT_NAME: NarutoUC2
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # The app defines no App Intents: skip the metadata extraction step.
        LM_SKIP_METADATA_EXTRACTION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": "App Icon & Top Shelf Image"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/NarutoUC2-macOS.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2,3"
